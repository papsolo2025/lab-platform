# kube-prometheus-stack values for the lab

# EKS manages the control plane - these components cannot be scraped, so turn them off
# (otherwise you get permanent TargetDown alerts).
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    # Pick up ServiceMonitors / PrometheusRules from every namespace, not only this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # additionalScrapeConfigs for the EC2 servers are generated by install.sh

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

grafana:
  # adminPassword is passed by install.sh
  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  ingress:
    enabled: true
    ingressClassName: alb
    path: /grafana
    pathType: Prefix
    hosts: []
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: devops-lab
      alb.ingress.kubernetes.io/group.order: "10"
      alb.ingress.kubernetes.io/healthcheck-path: /grafana/api/health
      # inbound-cidrs is set by install.sh from MY_IP_CIDR
  # Dashboards stored as ConfigMaps with label grafana_dashboard=1 are loaded automatically.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
